<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f7d4e">
<title>OR Housekeeping · TCCH</title>
<style>
:root{
  --fern:#3f7d4e; --fern-d:#2f5f3b; --plum:#5b2a5c; --honey:#f2b632; --slate:#2f3e46;
  --cloud:#f3f5f1; --line:#dfe4dc; --muted:#6b7a72; --white:#fff;
  --ok:#2e8b57; --ok-bg:#e5f4ea; --warn:#b7791f; --warn-bg:#fff4dc; --bad:#c0392b; --bad-bg:#fde8e6; --na:#7f8c8d; --na-bg:#eef1f1;
  --r:14px; --sh:0 2px 10px rgba(47,62,70,.08);
  font-family:'Cera Pro','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cloud);color:var(--slate);font-size:15px;line-height:1.4}
input,select,textarea,button{font:inherit;color-scheme:light}
button{cursor:pointer}
a{color:var(--plum)}
#print-root{display:none}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--white);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--fern-d);font-size:1.05rem}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--fern);color:#fff;display:grid;place-items:center;font-size:1.05rem}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--cloud);border:1px solid var(--line);font-size:.8rem;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ok-bg);color:var(--ok);border-color:#bfe3cb}
.chip.off{background:var(--bad-bg);color:var(--bad);border-color:#f3c3bd}
.chip.q{background:var(--warn-bg);color:var(--warn);border-color:#f2dca9}
.chip.role{background:#f1e8f1;color:var(--plum);border-color:#e0cfe0}
/* ---------- nav ---------- */
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:var(--fern)}
.nav button{border:0;border-radius:10px;padding:9px 14px;background:var(--plum);color:#fff;font-weight:700}
.nav button.active{background:var(--honey);color:var(--slate)}
.nav .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;line-height:20px;text-align:center}
main{padding:16px;max-width:none}
h1,h2,h3{margin:.2em 0 .5em;color:var(--slate)}
h2{font-size:1.2rem} h3{font-size:1.02rem}
.muted{color:var(--muted)} .small{font-size:.83rem}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.g-3,.g-2{grid-template-columns:1fr} main{padding:10px}
  .topbar{position:static;padding:8px 10px;gap:6px} #clock,.brand small{display:none} .topbar .chip{font-size:.72rem;padding:4px 8px} .topbar .btn{padding:6px 10px}
  .stickybar{margin:16px -16px -16px;padding:10px} .stickybar .btn{flex:1}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--white);color:var(--slate);border-radius:10px;padding:9px 14px;font-weight:700}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--fern);border-color:var(--fern);color:#fff}
.btn.plum{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.honey{background:var(--honey);border-color:var(--honey);color:var(--slate)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.big{padding:14px 18px;font-size:1.02rem;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-weight:700;font-size:.85rem;margin:10px 0 4px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;padding:10px 12px;border:1px solid #cfd6cc;border-radius:10px;background:#fff;color:var(--slate)}
textarea{min-height:70px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted);margin-top:3px}
.err{color:var(--bad);font-weight:700;font-size:.85rem;min-height:1.1em;margin-top:6px}
/* ---------- login ---------- */
.hero{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.big-kpi-btn{background:linear-gradient(135deg,var(--plum),#7d3f7e);color:#fff;border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:1rem;box-shadow:0 6px 18px rgba(91,42,92,.3)}
.board{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.tile.s-ok:before{background:var(--ok)} .tile.s-pend:before{background:var(--honey)} .tile.s-none:before{background:#c9d1cc}
.tile .t{font-weight:800}
.tile .s{font-size:.85rem;margin-top:4px}
.tile .w{font-size:.78rem;color:var(--muted);margin-top:6px}
.people h3{display:flex;align-items:center;gap:8px}
.names{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.name-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 12px;text-align:left;font-weight:700;box-shadow:var(--sh);min-height:56px}
.name-btn:hover{border-color:var(--fern);background:#f6fbf7}
.name-btn small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(30,40,35,.45);display:grid;place-items:center;z-index:100;padding:14px}
.modal{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:880px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.modal .mh h2{margin:0}
.x{border:0;background:var(--cloud);border-radius:10px;width:34px;height:34px;font-size:1.1rem}
/* ---------- pin pad ---------- */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:14px 0 6px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--fern);display:block}
.pin-dots i.on{background:var(--fern)}
.pin-msg{text-align:center;color:var(--bad);font-weight:700;min-height:1.3em;font-size:.88rem}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:8px auto 4px}
.pin-keys button{height:60px;border-radius:14px;border:1px solid var(--line);background:#f8faf7;font-size:1.35rem;font-weight:700}
.pin-keys button:active{background:#e8f1ea}
.pin-keys .k-alt{font-size:.9rem;color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* ---------- checklist ---------- */
.area-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.area-btn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;text-align:left;box-shadow:var(--sh);min-height:110px;position:relative}
.area-btn:hover{border-color:var(--fern)}
.area-btn .n{font-weight:800;font-size:1.05rem}
.area-btn .d{font-size:.8rem;color:var(--muted);margin-top:4px}
.area-btn .st{position:absolute;right:12px;top:12px}
.types{display:flex;gap:8px;flex-wrap:wrap}
.types button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700}
.types button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.sec{margin-top:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:6px}
.item.ans-D{border-color:#bfe3cb;background:#f5fbf7} .item.ans-N{border-color:#f3c3bd;background:#fff7f6} .item.ans-A{background:#f7f9f9}
.item.missing{border-color:var(--bad);box-shadow:0 0 0 2px rgba(192,57,43,.15)}
.item .lbl{flex:1;font-weight:600;font-size:.92rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:#fff;padding:8px 10px;font-weight:700;font-size:.8rem;min-width:62px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.D{background:var(--ok);color:#fff} .seg button.on.N{background:var(--bad);color:#fff} .seg button.on.A{background:var(--na);color:#fff}
@media (max-width:560px){.item{flex-direction:column;align-items:stretch}.seg button{flex:1}}
.stickybar{position:sticky;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px;margin:16px -16px -16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;border-radius:0 0 var(--r) var(--r)}
.notice{border-radius:12px;padding:10px 12px;font-size:.88rem;margin:8px 0}
.notice.warn{background:var(--warn-bg);border:1px solid #f2dca9}
.notice.info{background:#eef5f9;border:1px solid #d3e4ee}
.notice.bad{background:var(--bad-bg);border:1px solid #f3c3bd}
.notice.ok{background:var(--ok-bg);border:1px solid #bfe3cb}
.cbx{display:flex;gap:8px;align-items:center;margin:6px 0;font-weight:600}
.cbx input{width:18px;height:18px}
/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:.86rem}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:#f6f8f5;font-size:.78rem;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#f7fbf8}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:800;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-pend{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-na{background:var(--na-bg);color:var(--na)} .p-plum{background:#f1e8f1;color:var(--plum)}
/* ---------- KPI ---------- */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border-top:5px solid #c9d1cc}
.kpi.met{border-top-color:var(--ok)} .kpi.near{border-top-color:var(--honey)} .kpi.miss{border-top-color:var(--bad)}
.kpi .k{font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase}
.kpi .v{font-size:2rem;font-weight:800;margin:4px 0}
.kpi .d{font-size:.8rem;color:var(--muted)}
.gaps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.banner{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:200;background:var(--slate);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:700;cursor:pointer}
.toast{position:fixed;right:16px;top:70px;z-index:300;background:var(--slate);color:#fff;padding:12px 16px;border-radius:12px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}
footer{text-align:center;padding:20px;color:var(--muted);font-size:.8rem}
.sub-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sub-nav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
.sub-nav button.on{background:var(--slate);color:#fff;border-color:var(--slate)}
svg text{font-family:inherit}

/* ---------- PRINT ---------- */
@page{size:A4 portrait;margin:12mm}
@page landscape{size:A4 landscape;margin:10mm}
@media print{
  body{background:#fff}
  body > *:not(#print-root){display:none !important}
  #print-root{display:block;color:#000;font-size:10.5pt}
  .pr-land{page:landscape}
  .pr-page{page-break-after:always;break-after:page}
  .pr-page:last-child{page-break-after:auto;break-after:auto}
}
#print-root h1{font-size:15pt;margin:0} #print-root h2{font-size:12pt;margin:10px 0 6px} #print-root h3{font-size:11pt;margin:8px 0 4px}
.pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #3f7d4e;padding-bottom:6px;margin-bottom:8px}
.pr-head .org{font-size:9pt;color:#444}
.pr-meta{font-size:9pt;color:#333;margin-bottom:8px}
table.pr{border-collapse:collapse;width:100%;font-size:9pt;margin:4px 0 8px}
table.pr th,table.pr td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}
table.pr th{background:#eef2ec}
table.pr td.n,table.pr th.n{text-align:right}
.pr-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px;font-size:9pt}
.pr-sign div{border-top:1px solid #000;padding-top:3px;text-align:center}
.pr-lines div{border-bottom:1px solid #999;height:20px}
.pr-foot{font-size:8pt;color:#555;margin-top:8px}
.pr-page table.pr{font-size:8.3pt;margin:2px 0 5px} .pr-page table.pr th,.pr-page table.pr td{padding:2px 5px} .pr-page h3{margin:5px 0 3px}
.pr-page .pr-lines div{height:17px} .pr-page .pr-sign{margin-top:14px}
.pr-D{color:#1d6b3b;font-weight:700}.pr-N{color:#b0261a;font-weight:700}.pr-A{color:#666}
</style>
</head>

function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => b[i] = Math.random() * 256 | 0);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
// Pure-JS SHA-256 (works offline / on any origin)
function sha256(str){
  str = unescape(encodeURIComponent(str));
  const K = [], H = []; let p = 0;
  const isP = n => { for (let f = 2; f * f <= n; f++) if (n % f === 0) return false; return true; };
  for (let c = 2; p < 64; c++) if (isP(c)) { if (p < 8) H[p] = (Math.pow(c, .5) * 4294967296) | 0; K[p++] = (Math.pow(c, 1 / 3) * 4294967296) | 0; }
  const r = (v, a) => (v >>> a) | (v << (32 - a));
  const w = []; const bl = str.length * 8; str += '\x80';
  while (str.length % 64 - 56) str += '\x00';
  for (let i = 0; i < str.length; i++) w[i >> 2] |= str.charCodeAt(i) << ((3 - i) % 4) * 8;
  w[w.length] = (bl / 4294967296) | 0; w[w.length] = bl;
  let h = H.slice(0, 8);
  for (let j = 0; j < w.length;) {
    const W = w.slice(j, j += 16), o = h.slice(0);
    for (let i = 0; i < 64; i++) {
      const w15 = W[i - 15], w2 = W[i - 2], a = h[0], e = h[4];
      const t1 = h[7] + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & h[5]) ^ (~e & h[6])) + K[i] +
        (W[i] = (i < 16) ? W[i] : (W[i - 16] + (r(w15, 7) ^ r(w15, 18) ^ (w15 >>> 3)) + W[i - 7] + (r(w2, 17) ^ r(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
      h = [(t1 + t2) | 0].concat(h); h[4] = (h[4] + t1) | 0; h.pop();
    }
    for (let i = 0; i < 8; i++) h[i] = (h[i] + o[i]) | 0;
  }
  return h.map(x => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
}

function pinPad(el, { onComplete, title = '' }){
  let v = '', busy = false;
  el.innerHTML = `${title ? `<div class="small muted" style="text-align:center">${esc(title)}</div>` : ''}
    <div class="pin-dots"><i></i><i></i><i></i><i></i></div><div class="pin-msg"></div>

    <button type="button" data-k="C" class="k-alt">Clear</button><button type="button" data-k="0">0</button><button type="button" data-k="B" class="k-alt">⌫</button></div>`;
  const dots = $$('.pin-dots i', el), msg = $('.pin-msg', el);
  const draw = () => dots.forEach((d, i) => d.classList.toggle('on', i < v.length));
  const press = k => {
    if (busy) return;
    if (k === 'C') v = ''; else if (k === 'B') v = v.slice(0, -1); else if (v.length < 4) v += k;
    draw();
    if (v.length === 4){ busy = true; const p = v; setTimeout(async () => { try { await onComplete(p, api); } finally { busy = false; } }, 120); }
  };
  $$('[data-k]', el).forEach(b => b.onclick = () => press(b.dataset.k));
  const kh = e => {
    if (!document.body.contains(el)) { document.removeEventListener('keydown', kh); return; }
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('B');
  };
  document.addEventListener('keydown', kh);
  const api = {
    error(t){ v = ''; draw(); msg.textContent = t; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); },
    clear(){ v = ''; draw(); msg.textContent = ''; },
    destroy(){ document.removeEventListener('keydown', kh); }
  };
  return api;
}

/* ---------- 4. LOCAL STORE (IndexedDB, falls back to localStorage) ---------- */
const KV = (() => {
  let dbp = null;
  const ok = typeof indexedDB !== 'undefined';
  function db(){
    if (!dbp) dbp = new Promise((res, rej) => { const r = indexedDB.open('tcch-hk', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return dbp;
  }
  return {
    async get(k){
      if (!ok) { try { return JSON.parse(localStorage.getItem('hk:' + k)); } catch (e) { return null; } }
      const d = await db(); return new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); });
    },
    async set(k, v){
      if (!ok) { try { localStorage.setItem('hk:' + k, JSON.stringify(v)); } catch (e) {} return; }
      const d = await db(); return new Promise(res => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); });
    }
  };
})();
const S = { users: [], entries: {}, closures: [], settings: {}, errors: [], outbox: [], failed: [], sync: { entries: null }, me: null, lastPull: null };
async function loadLocal(){

  if (!S.sync) S.sync = { entries: null };
}
const saveLocal = (...keys) => Promise.all(keys.map(k => KV.set(k, S[k])));

/* ---------- 5. SYNC / OUTBOX ---------- */
let sb = null;
function initSupabase(){
  try {
    if (window.supabase && CONFIG.SUPABASE_KEY && !/PASTE_/.test(CONFIG.SUPABASE_KEY))
      sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { persistSession: false } });
  } catch (e) { sb = null; }
}
const isOnline = () => !!sb && navigator.onLine !== false;
const isNetErr = err => !err || /fetch|network|timeout|Load failed|NetworkError/i.test(String(err.message || err));
function enqueue(op){ op.opid = uuid(); op.tries = 0; S.outbox.push(op); saveLocal('outbox'); renderSyncChip(); flushSoon(); }
const flushSoon = debounce(() => flush(), 300);
let flushing = false;
async function flush(){
  if (flushing || !isOnline() || !S.outbox.length) return;
  flushing = true;
  try {
    while (S.outbox.length){
      const op = S.outbox[0]; let res;
      try {
        if (op.kind === 'upsert') res = await sb.from(op.table).upsert(op.row, { onConflict: op.conflict || 'id' });
        else if (op.kind === 'update') res = await sb.from(op.table).update(op.patch).eq('id', op.id);
      } catch (e) { res = { error: e }; }
      if (res && res.error){
        if (isNetErr(res.error)) break;                     // offline — try later
        op.tries++; op.lastError = res.error.message;
        if (op.tries >= 3){ S.outbox.shift(); S.failed.push(op); reportError('Sync failed after 3 tries: ' + op.table + ' — ' + op.lastError, '', JSON.stringify(op).slice(0, 1500)); }
        else break;
      } else S.outbox.shift();
      await saveLocal('outbox', 'failed');
    }
  } finally { flushing = false; renderSyncChip(); }
}
async function pullAll(){
  if (!isOnline()) return false;
  try {
    const [u, c, st] = await Promise.all([sb.from('hk_users').select('*'), sb.from('hk_closures').select('*'), sb.from('hk_settings').select('*')]);
    if (u.error || c.error || st.error) throw (u.error || c.error || st.error);
    const sig = x => JSON.stringify(x.map(r => (r.id || r.key) + r.updated_at).sort());
    let changed = sig(u.data) !== sig(S.users) || sig(c.data) !== sig(S.closures);
    S.users = u.data; S.closures = c.data; S.settings = Object.fromEntries(st.data.map(r => [r.key, r.value]));
    // incremental entries pull
    let since = S.sync.entries || '1970-01-01T00:00:00Z', maxTs = since, from = 0;
    for (;;){
      const r = await sb.from('hk_entries').select('*').gte('updated_at', since).order('updated_at', { ascending: true }).range(from, from + 999);
      if (r.error) throw r.error;
      for (const row of r.data){ const old = S.entries[row.id]; if (!old || old.updated_at !== row.updated_at || old._local) changed = true; S.entries[row.id] = row; if (row.updated_at > maxTs) maxTs = row.updated_at; }
      if (r.data.length < 1000) break; from += 1000;
    }
    S.sync.entries = maxTs;
    if (S.me && S.me.role === 'superuser'){ const e = await sb.from('hk_error_reports').select('*').order('created_at', { ascending: false }).limit(200); if (!e.error) S.errors = e.data; }
    // keep my own session record fresh
    if (S.me){ const fresh = userById(S.me.id); if (!fresh || fresh.status !== 'active') { logout('Your account is no longer active.'); } else S.me = fresh; }
    S.lastPull = new Date().toISOString();
    await saveLocal('users', 'closures', 'settings', 'entries', 'sync', 'errors');
    return changed ? 'changed' : true;
  } catch (e) {
    if (!isNetErr(e)) console.warn('pull failed', e);
    return false;
  } finally { renderSyncChip(); }
}
async function syncNow(force){ await flush(); const ok = await pullAll(); await flush(); if (ok === 'changed' || force) refreshView(); else { renderSyncChip(); updateNavBadge(); } return !!ok; }

const fails = {};
function loginModal(u){
  const w = openModal(`<div class="mh"><h2>${esc(u.name)}</h2><button class="x" data-close>✕</button></div><div class="small muted" style="text-align:center">${ROLE_LABEL[u.role]} · enter your 4-digit PIN</div><div data-pad></div>`);
  const pad = pinPad($('[data-pad]', w), { onComplete: async (pin, api) => {
    const f = fails[u.id] || { n: 0, until: 0 };
    if (Date.now() < f.until) { api.error('Too many tries. Wait ' + Math.ceil((f.until - Date.now()) / 1000) + 's.'); return; }
    if (hashPin(pin) !== u.pin_hash) { f.n++; if (f.n >= 5) { f.until = Date.now() + 30000; f.n = 0; } fails[u.id] = f; api.error('Wrong PIN'); return; }
    fails[u.id] = { n: 0, until: 0 }; pad.destroy(); w._onClose = null; closeModal(w);
    startSession(u);
    if (u.must_change_pin) setPinModal(u, true);
    else if (!u.q1 || !u.q2) securityPrompt(u);
  } });
  w._onClose = () => pad.destroy();
}
function qSelect(name, exclude){ return `<select name="${name}"><option value="">— choose a question —</option>${QUESTIONS.filter(q => q !== exclude).map(q => `<option>${esc(q)}</option>`).join('')}</select>`; }
function wireQPair(w){
  const q1 = $('[name=q1]', w), q2wrap = $('[data-q2]', w);
  const redo = () => { const cur = $('[name=q2]', w).value; q2wrap.innerHTML = qSelect('q2', q1.value); if (cur && cur !== q1.value) $('[name=q2]', w).value = cur; };

function draftClear(area){ try { localStorage.removeItem(draftKey(area)); } catch (e) {} }

function validateForm(){
  const F = UI.form, isFw = F.area === 'footwear', errs = [];
  $$('.item.missing').forEach(x => x.classList.remove('missing'));
  if (!F.date) errs.push('Enter the date of cleaning.');
  else if (F.date > today()) errs.push('The date cannot be in the future.');
  else if (F.date < addDays(today(), -LATE_MAX_DAYS)) errs.push('Entries older than ' + LATE_MAX_DAYS + ' days cannot be logged — ask the SuperUser.');
  if (F.date && F.date < today() && wordCount(F.lateReason) < 5) errs.push('Give a reason for the late entry (at least 5 words).');
  if (!F.type) errs.push('Choose the type of cleaning.');
  if (F.type === 'other' && !F.typeOther.trim()) errs.push('Describe the “Other” cleaning.');
  if (F.type){
    const missing = [];
    sectionsFor(F.area, F.type).forEach(([, ids]) => ids.forEach(id => { if (!F.tasks[id]) missing.push('tasks:' + id); }));
    if (!isFw && TERMINAL_TYPES.includes(F.type)) terminalFor(F.area).forEach(id => { if (!F.terminal[id]) missing.push('terminal:' + id); });
    missing.forEach(k => { const r = $(`[data-item="${k}"]`); if (r) r.classList.add('missing'); });
    if (missing.length) errs.push(missing.length + ' item(s) not answered yet (outlined in red).');
    const anyN = Object.values(F.tasks).includes('N') || Object.values(F.terminal).includes('N');
    if (anyN && wordCount(F.remarks) < 3) errs.push('Some items are “Not done” — explain in Remarks.');
  }
  if (isFw){
    if (!F.fw.from.length && !F.fw.fromOther.trim()) errs.push('Tick where the footwear was collected from.');
    ['pairs','soiled','removed'].forEach(k => { if (F.fw[k] === '' || +F.fw[k] < 0 || isNaN(+F.fw[k])) errs.push('Enter the footwear counts (0 if none).'); });
    if (+F.fw.soiled > +F.fw.pairs || +F.fw.removed > +F.fw.pairs) errs.push('Soiled / removed pairs cannot be more than total pairs cleaned.');
    if (!F.fw.disinfectant.trim()) errs.push('Enter the disinfectant used.');
  }
  return [...new Set(errs)];
}
async function submitForm(verifyNow){
  const errs = validateForm(), errEl = $('[data-err]');
  if (errs.length){ errEl.innerHTML = errs.map(esc).join('<br>'); const m = $('.item.missing'); const tgt = m || errEl; if (tgt.scrollIntoView) tgt.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  errEl.textContent = '';
  const F = UI.form;
  const entry = {
    id: uuid(), area: F.area, cleaning_date: F.date, cleaning_type: F.type, cleaning_type_other: F.type === 'other' ? F.typeOther.trim() : null,
    is_terminal: TERMINAL_TYPES.includes(F.type), tasks: { ...F.tasks }, terminal_tasks: { ...F.terminal },
    footwear: F.area === 'footwear' ? { from: F.fw.from, from_other: F.fw.fromOther.trim() || null, pairs: +F.fw.pairs, soiled: +F.fw.soiled, removed: +F.fw.removed, disinfectant: F.fw.disinfectant.trim() } : null,
    remarks: F.remarks.trim() || null, late_reason: F.date < today() ? F.lateReason.trim() : null,
    logged_by_id: S.me.id, logged_by_name: S.me.name, team: F.team.length ? F.team.join(', ') : null,
    inspector_id: null, inspector_name: null, inspection_status: 'pending', inspection_ok: null, inspection_remarks: null, inspected_at: null,
    submitted_at: new Date().toISOString(), source: 'app', voided: false
  };
  if (verifyNow){
    const exclude = new Set([S.me.id, ...activeUsers().filter(u => F.team.includes(u.name)).map(u => u.id)]);
    const insp = await inspectorPick(exclude, entry);
    if (!insp) return;
    Object.assign(entry, { inspector_id: insp.user.id, inspector_name: insp.user.name, inspection_status: 'inspected', inspection_ok: insp.ok, inspection_remarks: insp.remarks || null, inspected_at: new Date().toISOString() });
  }

  draftClear(F.area); UI.form = null;
  const w = openModal(`<div class="mh"><h2>✅ Submitted</h2></div><p>${esc(AREA[entry.area].name)} — ${esc(TYPE_LABEL[entry.cleaning_type])}, ${fmtD(entry.cleaning_date)}.</p>
    <p class="small">${entry.inspection_status === 'inspected' ? 'Inspected by <b>' + esc(entry.inspector_name) + '</b>.' : 'Waiting for a verifier to inspect it (it shows in their “To Inspect” list).'}
    ${isOnline() ? '' : '<br><b>Saved on this device</b> — it will upload automatically when the internet is back.'}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-out>Log out</button><button class="btn primary" data-more>Log another area</button></div>`);
  $('[data-out]', w).onclick = () => { closeModal(w); logout(); };
  $('[data-more]', w).onclick = () => { closeModal(w); render(); };
  w._onClose = () => render();
}
function saveEntry(entry){
  S.entries[entry.id] = { ...entry, updated_at: entry.submitted_at, _local: true };
  saveLocal('entries');
  const row = { ...entry }; delete row._local;
  enqueue({ kind: 'upsert', table: 'hk_entries', row });

/* Inspector verification — one modal, two steps (name → PIN), no nested modals */
function inspectorPick(excludeIds, entry){
  return new Promise(resolve => {
    const list = activeUsers().filter(u => (u.role === 'verifier' || u.role === 'superuser') && !excludeIds.has(u.id)).sort((a, b) => a.name.localeCompare(b.name));
    const w = openModal(`<div class="mh"><h2>Inspector sign-off</h2><button class="x" data-close>✕</button></div><div data-body></div>`, { onClose: () => resolve(null) });
    const body = $('[data-body]', w);
    const nN = Object.values(entry.tasks).concat(Object.values(entry.terminal_tasks)).filter(v => v === 'N').length;
    const step1 = () => {
      body.innerHTML = `<div class="notice info">The verifier must be <b>physically present</b> and enter their own PIN. You cannot inspect your own work.</div>
        ${nN ? `<div class="notice warn">${nN} item(s) marked Not done.</div>` : ''}
        <div class="names">${list.map(u => `<button class="name-btn" data-i="${u.id}">${esc(u.name)}<small>${ROLE_LABEL[u.role]}</small></button>`).join('') || '<div class="muted">No verifiers registered yet. Use “Submit — inspect later”.</div>'}</div>`;
      $$('[data-i]', body).forEach(b => b.onclick = () => step2(userById(b.dataset.i)));
    };
    const step2 = u => {
      body.innerHTML = `<p style="text-align:center"><b>${esc(u.name)}</b>, enter your PIN to confirm you inspected this area.</p><div data-pad></div><div style="text-align:center"><button class="btn ghost" data-back>← Different verifier</button></div>`;
      const pad = pinPad($('[data-pad]', body), { onComplete: (pin, api) => {
        if (hashPin(pin) !== u.pin_hash) return api.error('Wrong PIN');
        pad.destroy(); step3(u);
      } });
      $('[data-back]', body).onclick = () => { pad.destroy(); step1(); };
    };
    const step3 = u => {
      body.innerHTML = `<p>Inspected by <b>${esc(u.name)}</b> ✅</p>
        <label class="f">Inspection result</label><label class="cbx"><input type="radio" name="ok" value="1" checked> Acceptable</label><label class="cbx"><input type="radio" name="ok" value="0"> Issues found — needs follow-up</label>
        <label class="f">Inspector remarks (required if issues found)</label><textarea data-r></textarea><div class="err" data-e></div>
        <div class="row" style="justify-content:flex-end"><button class="btn primary" data-ok>Confirm &amp; submit</button></div>`;
      $('[data-ok]', body).onclick = () => {
        const ok = $('[name=ok]:checked', body).value === '1', r = $('[data-r]', body).value.trim();
        if (!ok && wordCount(r) < 3) return $('[data-e]', body).textContent = 'Describe the issues found.';
        w._onClose = null; closeModal(w); resolve({ user: u, ok, remarks: r });
      };
    };
    step1();
  });
}

function entrySummary(e){

function kpiCompute({ entries, closures, from, to, area = 'all', staff = 'all', todayStr, footwearStart }){

    }
  }

    const fwStart = footwearStart || todayStr;
    const fwSun0 = sundays.filter(s => s >= fwStart);
    const fw = new Set(ET.filter(e => e.area === 'footwear' && (e.cleaning_type === 'fw_weekly' || e.cleaning_type === 'fw_rescheduled')).map(e => weekKey(e.cleaning_date)));
    const fwSun = fwSun0.filter(s => addDays(s, 1) < todayStr || fw.has(s));

}
function svgBars(labels, values, { w = 640, h = 220, target = null, color = '#3f7d4e' } = {}){
  const L0 = 38, R = 10, T = 14, B = 30, iw = w - L0 - R, ih = h - T - B, n = Math.max(labels.length, 1), bw = Math.min(46, iw / n * .62);
  const y = v => T + ih - (v / 100) * ih; let g = '';
  for (let v = 0; v <= 100; v += 20) g += `<line x1="${L0}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e8e1"/><text x="${L0 - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#555">${v}</text>`;
  labels.forEach((l, i) => { const cx = L0 + iw / n * (i + .5), v = values[i];
    if (v != null) g += `<rect x="${cx - bw / 2}" y="${y(v)}" width="${bw}" height="${T + ih - y(v)}" fill="${color}"/><text x="${cx}" y="${y(v) - 3}" font-size="9" text-anchor="middle">${Math.round(v * 10) / 10}</text>`;
    g += `<text x="${cx}" y="${h - B + 14}" font-size="10" text-anchor="middle" fill="#555">${esc(l)}</text>`; });
  if (target != null) g += `<line x1="${L0}" x2="${w - R}" y1="${y(target)}" y2="${y(target)}" stroke="#c0392b" stroke-dasharray="5 4"/><text x="${w - R}" y="${y(target) - 4}" font-size="10" text-anchor="end" fill="#c0392b">target ${target}%</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">${g}</svg>`;
}

function doPrint(html, title){
  const root = $('#print-root'); root.innerHTML = html;
  const old = document.title; document.title = title;
  const done = () => { document.title = old; root.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { try { window.print(); } catch (e) {} }, 60);
}

  $('[data-full]', box).onclick = async () => { S.sync.entries = null; const ok = await syncNow(); toast(ok ? 'Re-downloaded everything.' : 'Could not reach the server.', ok ? 'ok' : 'bad'); };
  $('[data-all]', box).onclick = () => exportCSV(liveEntries().sort((a, b) => a.cleaning_date.localeCompare(b.cleaning_date)), { from: DATA_START, to: today() });
  $$('[data-retry]', box).forEach(b => b.onclick = () => { const o = S.failed.splice(+b.dataset.retry, 1)[0]; o.tries = 0; S.outbox.push(o); saveLocal('outbox', 'failed'); flush().then(() => adminData(box)); });
  $$('[data-drop]', box).forEach(b => b.onclick = async () => { if (!await confirmBox('Discard', 'Discard this failed upload? It will not be saved to the server.', 'Discard', true)) return; S.failed.splice(+b.dataset.drop, 1); saveLocal('failed'); adminData(box); });
}

/* ---------- 16. ERROR MONITORING + UPDATES ---------- */
let lastErr = { m: '', t: 0 };
function reportError(message, stack, context){
  const row = { id: uuid(), message: String(message).slice(0, 500), stack: String(stack || '').slice(0, 3000), context: String(context || '').slice(0, 2000),
    user_name: S.me ? S.me.name : '(not logged in)', user_agent: navigator.userAgent, app_version: APP_VERSION, resolved: false };
  S.errors.unshift({ ...row, created_at: new Date().toISOString() }); saveLocal('errors');
  enqueue({ kind: 'upsert', table: 'hk_error_reports', row });
}
function errorPopup(message, stack){
  if (lastErr.m === message && Date.now() - lastErr.t < 10000) return; lastErr = { m: message, t: Date.now() };
  const w = openModal(`<div class="mh"><h2>⚠️ Something went wrong</h2><button class="x" data-close>✕</button></div>
    <p class="small">${esc(message)}</p><p class="small muted">Your saved entries are safe. Tap below to send this to the SuperUser so it can be fixed.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Dismiss</button><button class="btn primary" data-rep>Report to SuperUser Ralp</button></div>`);
  $$('[data-close]', w).forEach(b => b.onclick = () => closeModal(w));
  $('[data-rep]', w).onclick = () => { reportError(message, stack, 'tab=' + UI.tab + (UI.form ? ' area=' + UI.form.area : '')); closeModal(w); toast('Reported. Thank you!', 'ok'); };
}
window.addEventListener('error', e => { if (!e.message || /ResizeObserver|Script error/i.test(e.message)) return; errorPopup(e.message, e.error && e.error.stack); });
window.addEventListener('unhandledrejection', e => { const r = e.reason || {}; if (isNetErr(r)) return; errorPopup(String(r.message || r), r.stack); });
function registerSW(){
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const show = () => { if ($('.banner')) return; const b = document.createElement('div'); b.className = 'banner'; b.textContent = '🔄 Update available — tap to refresh';
      b.onclick = () => { if (reg.waiting) reg.waiting.postMessage('skipWaiting'); else location.reload(); }; document.body.appendChild(b); };
    if (reg.waiting && navigator.serviceWorker.controller) show();
    reg.addEventListener('updatefound', () => { const nw = reg.installing; nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) show(); }); });
    setInterval(() => reg.update().catch(() => {}), 30 * 60000);
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
}

/* ---------- 17. BOOT ---------- */
async function boot(){
  await loadLocal();
  initSupabase();
  render();
  registerSW();
  window.addEventListener('online', () => syncNow());
  window.addEventListener('offline', renderSyncChip);
  await syncNow(true);
  setInterval(() => { if (document.visibilityState !== 'hidden') syncNow(); }, 60000);
}
window.HK = { kpiCompute, kpiMonthly, weekKey, sha256, hashPin, S, UI, AREAS, sectionsFor, terminalFor, render, openForm, saveEntry, startSession };
boot();
</script>
